<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exchange Coin Search</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <h1 class="header-title">Exchange Search</h1>
      <button id="refreshBtn" class="refresh-btn" title="Refresh coin list">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
        </svg>
      </button>
    </header>

    <!-- Exchange Tabs -->
    <div class="exchange-bar">
      <div id="exchangeTabs" class="exchange-tabs" role="tablist" aria-label="Exchange selection"></div>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search coin pairs..."
          autocomplete="off"
        />
      </div>
    </div>

    <!-- Status -->
    <div class="status" id="status"></div>

    <!-- Results -->
    <div class="results-scroll">
      <!-- Skeleton -->
      <div id="skeleton" class="skeleton-list">
        <div class="skeleton-row"><div class="skel skel-title w16"></div><div class="skel skel-sub w24"></div><div class="skel skel-badge w10"></div></div>
        <div class="skeleton-row"><div class="skel skel-title w14"></div><div class="skel skel-sub w20"></div><div class="skel skel-badge w10"></div></div>
        <div class="skeleton-row"><div class="skel skel-title w20"></div><div class="skel skel-sub w28"></div><div class="skel skel-badge w10"></div></div>
        <div class="skeleton-row"><div class="skel skel-title w12"></div><div class="skel skel-sub w16"></div><div class="skel skel-badge w10"></div></div>
        <div class="skeleton-row"><div class="skel skel-title w18"></div><div class="skel skel-sub w32"></div><div class="skel skel-badge w10"></div></div>
        <div class="skeleton-row"><div class="skel skel-title w14"></div><div class="skel skel-sub w20"></div><div class="skel skel-badge w10"></div></div>
        <div class="skeleton-row"><div class="skel skel-title w16"></div><div class="skel skel-sub w24"></div><div class="skel skel-badge w10"></div></div>
        <div class="skeleton-row"><div class="skel skel-title w12"></div><div class="skel skel-sub w20"></div><div class="skel skel-badge w10"></div></div>
      </div>
      <!-- Results list -->
      <ul id="resultsList" class="results-list hidden"></ul>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span id="lastUpdated" class="footer-text"></span>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
